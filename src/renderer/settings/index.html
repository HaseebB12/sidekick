<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sidekick — Settings</title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body>
    <header class="titlebar">
      <div class="brand">
        <svg viewBox="0 0 24 24" class="mark"><circle cx="12" cy="12" r="9" /><circle cx="9" cy="10" r="1.6" /><circle cx="15" cy="10" r="1.6" /><path d="M9 15c1.8 1.4 4.2 1.4 6 0" /></svg>
        Sidekick <span>Settings</span>
      </div>
      <div class="win-actions">
        <button id="btnMin" title="Minimise"><svg viewBox="0 0 24 24"><path d="M6 12h12" /></svg></button>
        <button id="btnClose" title="Close"><svg viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17" /></svg></button>
      </div>
    </header>

    <main>
      <section>
        <h2>Gemini</h2>
        <label class="field">
          <span class="label">API key</span>
          <div class="key-row">
            <input type="password" id="apiKey" placeholder="AIza…" spellcheck="false" autocomplete="off" />
            <button type="button" id="btnReveal" class="ghost" title="Show / hide">Show</button>
          </div>
          <p class="hint">
            Stored on this device only. Get a free key at
            <a href="#" data-external="https://aistudio.google.com/apikey">aistudio.google.com/apikey</a>.
          </p>
        </label>

        <label class="field">
          <span class="label">Model</span>
          <div class="key-row">
            <input list="modelList" id="model" spellcheck="false" autocomplete="off" />
            <datalist id="modelList"></datalist>
            <button type="button" id="btnTest" class="primary">Test key</button>
          </div>
          <p class="hint" id="testResult">Model IDs drift — Test key lists what your key can actually use.</p>
        </label>
      </section>

      <section>
        <h2>Summoning</h2>
        <label class="field">
          <span class="label">Hotkey</span>
          <div class="key-row">
            <input type="text" id="hotkey" readonly placeholder="Click, then press keys" />
            <button type="button" id="btnRecord" class="ghost">Record</button>
          </div>
          <p class="hint" id="hotkeyHint">Works from inside any app. Press Esc while recording to cancel.</p>
        </label>

        <label class="toggle">
          <input type="checkbox" id="keepOnDesktop" />
          <span>
            <strong>Keep on desktop always</strong>
            <em>Permanent pet mode — the character stays out and the hotkey calls it to your cursor.</em>
          </span>
        </label>

        <label class="toggle">
          <input type="checkbox" id="rememberConversation" />
          <span>
            <strong>Remember the last conversation</strong>
            <em>Off by default: every summon starts a fresh thread.</em>
          </span>
        </label>
      </section>

      <section>
        <h2>Presence</h2>
        <div class="field">
          <span class="label">Liveliness</span>
          <div class="segmented" id="liveliness">
            <button type="button" data-value="calm">Calm</button>
            <button type="button" data-value="playful">Playful</button>
            <button type="button" data-value="off">Off</button>
          </div>
          <p class="hint" id="livelinessHint"></p>
        </div>

        <label class="field">
          <span class="label">Size <output id="scaleOut">100%</output></span>
          <input type="range" id="scale" min="0.6" max="1.8" step="0.05" />
        </label>

        <label class="toggle">
          <input type="checkbox" id="webLine" />
          <span><strong>Web-line</strong><em>Thin string from the top edge during a swing.</em></span>
        </label>

        <label class="toggle">
          <input type="checkbox" id="reducedMotion" />
          <span><strong>Reduce motion</strong><em>Minimises the entrance and idle movement. Your OS setting is honoured too.</em></span>
        </label>
      </section>

      <section>
        <h2>Characters</h2>
        <p class="hint block" id="folderHint"></p>
        <div class="btn-row">
          <button type="button" id="btnAdd" class="primary">Add character image…</button>
          <button type="button" id="btnFolder" class="ghost">Open characters folder</button>
        </div>
        <input type="file" id="fileInput" accept="image/*" multiple hidden />
        <div class="char-strip" id="charStrip"></div>
        <p class="hint block" id="charHint"></p>
      </section>

      <section class="danger">
        <h2>About</h2>
        <p class="hint block" id="aboutText"></p>
        <div class="btn-row">
          <button type="button" id="btnReset" class="ghost danger-btn">Reset everything</button>
          <button type="button" id="btnQuit" class="ghost danger-btn">Quit Sidekick</button>
        </div>
        <p class="hint block">
          Reset clears the API key, colours, positions and any characters you added, then
          puts Sidekick back to defaults.
        </p>
      </section>
    </main>

    <div class="saved" id="saved" hidden>Saved</div>

    <script src="../shared/bridge-web.js"></script>
    <script src="settings.js"></script>
  </body>
</html>
